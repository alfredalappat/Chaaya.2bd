{"@context":"https://schema.org","@type":"WebApplication","name":"Chaaya.2bd","url":"https://YOUR-DOMAIN.com/","applicationCategory":"SocialNetworkingApplication","operatingSystem":"Any","description":"Free online chat to meet Malayali strangers.","offers":{"@type":"Offer","price":"0","priceCurrency":"INR"},"inLanguage":["en","ml"]}

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#2a2118;--mute:#7a6a58;--pri:#1f6f5c;--pri2:#2f9e82;--acc:#e8a33d;--line:#eadfce;--them:#f3ebdd;--shadow:0 10px 30px rgba(74,52,20,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#14110d;--card:#1e1a15;--ink:#f4ece0;--mute:#a89a86;--pri:#3aa389;--pri2:#56c3a8;--line:#332b21;--them:#2b251d;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.view{display:none;min-height:100%;flex-direction:column}
.view.on{display:flex}
/* HOME */
#home{background:radial-gradient(600px 300px at 85% -50px,rgba(232,163,61,.22),transparent),radial-gradient(500px 300px at -10% 20%,rgba(47,158,130,.16),transparent),var(--bg)}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:26px 20px 30px;display:flex;flex-direction:column;flex:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.35rem}
.brand .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:1.2rem;box-shadow:var(--shadow)}
.brand em{font-style:normal;color:var(--acc)}
.hero{margin:44px 0 6px}
.hero h1{font-size:2.1rem;line-height:1.15;font-weight:800;letter-spacing:-.8px}
.hero h1 span{background:linear-gradient(90deg,var(--pri),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:12px 0 18px}
.online{display:inline-flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:.9rem;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.22);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,197,94,.08)}}
.cards{display:grid;gap:14px;margin:28px 0 22px}
.opt{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;width:100%;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.opt:not(.lock):hover{transform:translateY(-2px);border-color:var(--pri2)}
.opt:not(.lock):active{transform:scale(.98)}
.opt.main{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:#fff}
.opt.main p{color:rgba(255,255,255,.85)}
.opt.main .ico{background:rgba(255,255,255,.2)}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--them);flex:none}
.opt h2{font-size:1.1rem;font-weight:700}.opt p{color:var(--mute);font-size:.88rem}
.arrow{margin-left:auto;font-size:1.3rem;opacity:.8}
.lock{opacity:.75;cursor:not-allowed}
.badge{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:700;background:rgba(232,163,61,.18);color:#b9770e;padding:4px 11px;border-radius:99px}
.note{font-size:.78rem;color:var(--mute);text-align:center;margin-top:auto;padding-top:14px}
.note a{color:var(--pri);font-weight:600}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#2a2118;color:#fff;padding:11px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;font-size:.9rem;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
/* CHAT */
#chat{height:100dvh;max-width:760px;margin:auto;background:var(--bg);border-inline:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border-radius:50%;font-size:1.3rem;display:grid;place-items:center}
.back:active{background:var(--them)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#f3c677);display:grid;place-items:center;font-size:1.2rem;flex:none}
.who b{display:block;line-height:1.2}
.who small{color:var(--mute);display:flex;align-items:center;gap:6px}
.who small i{width:7px;height:7px;border-radius:50%;background:#22c55e;display:none}
.who.live small i{display:block}
.spacer{flex:1}
.next{background:var(--pri);color:#fff;padding:9px 20px;border-radius:99px;font-weight:700;font-size:.92rem;box-shadow:0 4px 12px rgba(31,111,92,.3)}
.next:active{transform:scale(.96)}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}
.m{max-width:80%;padding:10px 15px;border-radius:20px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;animation:pop .18s ease-out;line-height:1.4}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-bottom-right-radius:6px}
.m.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.sys{align-self:center;background:var(--them);color:var(--mute);font-size:.8rem;text-align:center;padding:6px 14px;border-radius:99px;max-width:92%}
.m.photo{padding:4px;width:min(62%,260px)}
.m.photo.them{background:var(--card)}
.photo .sq{width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--them)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.typing{align-self:flex-start;display:none;gap:4px;background:var(--card);border:1px solid var(--line);padding:13px 15px;border-radius:20px;border-bottom-left-radius:6px}
.typing.on{display:flex}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 18px;border-radius:99px;font:inherit;outline:none}
.bar input[type=text]:focus{border-color:var(--pri2)}
.round{width:46px;height:46px;border-radius:50%;background:var(--them);font-size:1.2rem;flex:none;display:grid;place-items:center}
.round.go{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(31,111,92,.3)}
.bar :disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main id="home" class="view on">
  <div class="wrap">
    <div class="brand"><div class="lg">☕</div><div>Chaaya<em>.2bd</em></div></div>
    <div class="hero">
      <h1>Meet Malayalis,<br><span>over a cup of chaya.</span></h1>
      <p>Chat with a random Malayali in seconds. Free, no sign-up.</p>
      <div class="online"><i class="dot"></i><span><b id="count">–</b> online now</span></div>
    </div>
    <div class="cards">
      <button class="opt main" id="textBtn"><div class="ico">💬</div><div><h2>Text Chat</h2><p>Meet someone new instantly</p></div><span class="arrow">→</span></button>
      <button class="opt lock" id="videoBtn" aria-disabled="true"><span class="badge">Coming soon</span><div class="ico">🎥</div><div><h2>Video Chat</h2><p>Face-to-face chat is on the way</p></div></button>
    </div>
    <p class="note">By continuing you confirm you are 18+ and accept our <a href="/terms" target="_blank" rel="noopener">Terms &amp; Privacy</a>.<br>Never share personal details with strangers.</p>
  </div>
</main>

<main id="chat" class="view">
  <div class="top">
    <button class="back" id="stop" aria-label="Leave chat">←</button>
    <div class="av">🙂</div>
    <div class="who" id="who"><b>Stranger</b><small><i></i><span id="status">Connecting…</span></small></div>
    <div class="spacer"></div>
    <button class="next" id="next">Next</button>
  </div>
  <div id="msgs" aria-live="polite"><div class="typing" id="typing"><i></i><i></i><i></i></div></div>
  <form class="bar" id="form" autocomplete="off">
    <button type="button" class="round" id="photoBtn" aria-label="Send photo" disabled>📷</button>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="text" id="input" placeholder="Type a message…" maxlength="500" enterkeyhint="send" disabled>
    <button type="submit" class="round go" id="send" aria-label="Send" disabled>➤</button>
  </form>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let ws, state = 'idle', typingTimer, lastTyping = 0;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function show(v){['home','chat'].forEach(x=>$(x).classList.toggle('on',x===v))}
function setReady(on){['input','send','photoBtn'].forEach(i=>$(i).disabled=!on);if(on)$('input').focus()}
function setState(s,label){state=s;$('status').textContent=label;$('who').classList.toggle('live',s==='chatting');setReady(s==='chatting')}

function add(cls,text){
  const d=document.createElement('div');d.className='m '+cls;d.textContent=text;
  $('msgs').insertBefore(d,$('typing'));scroll();return d;
}
function addPhoto(cls,src){
  const d=document.createElement('div');d.className='m photo '+cls;
  const sq=document.createElement('div');sq.className='sq';
  const im=document.createElement('img');im.src=src;im.alt='Shared photo';
  sq.appendChild(im);d.appendChild(sq);$('msgs').insertBefore(d,$('typing'));scroll();
}
function scroll(){const m=$('msgs');m.scrollTop=m.scrollHeight}
function clearChat(){[...$('msgs').querySelectorAll('.m')].forEach(n=>n.remove());$('typing').classList.remove('on')}

function connect(cb){
  if(ws&&ws.readyState===1)return cb&&cb();
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>cb&&cb();
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='online')$('count').textContent=m.n;
    else if(m.t==='searching'){setState('searching','Looking for someone…');add('sys','Looking for a stranger…')}
    else if(m.t==='matched'){clearChat();setState('chatting','Online');add('sys','You are connected. Say hi! 👋')}
    else if(m.t==='msg'){$('typing').classList.remove('on');add('them',m.text)}
    else if(m.t==='img'&&m.data.startsWith('data:image/jpeg;base64,')){addPhoto('them',m.data)}
    else if(m.t==='typing'){$('typing').classList.toggle('on',m.on);scroll()}
    else if(m.t==='left'){$('typing').classList.remove('on');setState('ended','Disconnected');add('sys','Stranger has left. Tap Next to find someone new.')}
  };
  ws.onclose=()=>{if($('chat').classList.contains('on')){setState('ended','Connection lost');add('sys','Connection lost. Tap Next to reconnect.')}else setTimeout(()=>connect(),2000)};
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

function findNext(){clearChat();setState('searching','Looking for someone…');connect(()=>tx({t:'join'}))}
function goHome(){tx({t:'leave'});setState('idle','');show('home')}

// Phone back button: goes from chat back to the home screen
history.replaceState({v:'home'},'');
$('textBtn').onclick=()=>{history.pushState({v:'chat'},'');show('chat');findNext()};
window.addEventListener('popstate',()=>{if($('chat').classList.contains('on'))goHome()});
$('stop').onclick=()=>{if(history.state&&history.state.v==='chat')history.back();else goHome()};
$('videoBtn').onclick=()=>toast('Video chat is coming soon! 🎥');
$('next').onclick=findNext;

// Sending keeps the keyboard open
function sendMsg(){
  const t=$('input').value.trim();
  if(t&&state==='chatting'){tx({t:'msg',text:t});add('me',t);$('input').value=''}
  $('input').focus();
}
$('form').onsubmit=e=>{e.preventDefault();sendMsg()};
$('send').addEventListener('mousedown',e=>e.preventDefault());
$('send').addEventListener('touchstart',e=>{e.preventDefault();sendMsg()},{passive:false});
$('input').oninput=()=>{
  if(state!=='chatting'||Date.now()-lastTyping<1500)return;
  lastTyping=Date.now();tx({t:'typing',on:true});
  clearTimeout(typingTimer);typingTimer=setTimeout(()=>tx({t:'typing',on:false}),2000);
};

// Photo: center-crop to a square before sending
$('photoBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const s=Math.min(img.width,img.height),S=480,c=document.createElement('canvas');
    c.width=c.height=S;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);
    const data=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);
    if(state==='chatting'){tx({t:'img',data});addPhoto('me',data)}
  };
  img.onerror=()=>toast('Could not read that photo');
  img.src=url;
};

connect(); // loads the live online counter on the home screen
</script>
</body>
</html>
